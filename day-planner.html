<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>برنامه‌ریز روزانه</title>
<style>
:root{--bg:#fff5f8;--bg2:#ffe3ee;--card:#fff;--text:#3b1f2b;--muted:#8a6b78;--line:#f6d5e1;--accent:#db2777;--accent-soft:#fde4ef;--high:#dc2626;--mid:#d97706;--low:#2563eb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1f1419;--bg2:#2b1621;--card:#2a1b22;--text:#f7e8ee;--muted:#b99aa7;--line:#43303a;--accent:#f472b6;--accent-soft:#4a1f33;--high:#f87171;--mid:#fbbf24;--low:#60a5fa}}
:root[data-theme="dark"]{--bg:#1f1419;--bg2:#2b1621;--card:#2a1b22;--text:#f7e8ee;--muted:#b99aa7;--line:#43303a;--accent:#f472b6;--accent-soft:#4a1f33;--high:#f87171;--mid:#fbbf24;--low:#60a5fa}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Vazirmatn,Tahoma,"Segoe UI",sans-serif;line-height:1.6}
main{max-width:560px;margin:0 auto;padding:20px 16px 48px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:16px}
h1{font-size:20px;margin:0}
.date{color:var(--muted);font-size:14px}
.nav button{background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:6px 10px;cursor:pointer;font:inherit}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.prog-row{display:flex;justify-content:space-between;font-size:14px;margin-bottom:8px}
.bar{height:10px;background:var(--accent-soft);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
form{display:grid;grid-template-columns:1fr auto;gap:8px}
input,select{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-width:0}
input[type=text]{grid-column:1/-1}
form .row{grid-column:1/-1;display:flex;gap:8px}
form .row>*{flex:1}
.add{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px;font:inherit;cursor:pointer;grid-column:1/-1}
:root[data-theme="dark"] .add{color:#2a0f1b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .add{color:#2a0f1b}}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{flex:1;background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:6px;font:inherit;cursor:pointer}
.tabs button.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
ul{list-style:none;margin:0;padding:0}
li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
li:last-child{border-bottom:0}
li input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent);flex:none}
.t{flex:1;min-width:0;word-break:break-word}
.done .t{text-decoration:line-through;color:var(--muted)}
.meta{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.del{background:none;border:0;color:var(--muted);cursor:pointer;font-size:18px;padding:4px}
.empty{text-align:center;color:var(--muted);padding:18px 0}
.foot{display:flex;justify-content:space-between;font-size:13px}
.foot button{background:none;border:0;color:var(--muted);cursor:pointer;font:inherit;text-decoration:underline}
textarea{width:100%;min-height:80px;font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;resize:vertical}
h2{font-size:15px;margin:0 0 8px}
.rem{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:13px}
.rem select,.rem button{font:inherit;font-size:13px;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);cursor:pointer}
.rem .st{color:var(--muted);flex-basis:100%}
#toasts{position:fixed;top:0;left:0;right:0;z-index:50;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 0;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{pointer-events:auto;width:100%;max-width:520px;background:var(--card);border:1px solid var(--accent);border-inline-start:5px solid var(--accent);border-radius:12px;padding:12px 14px;box-shadow:0 6px 24px rgba(0,0,0,.2);display:flex;gap:10px;align-items:center}
.toast b{display:block}
.toast .tx{flex:1;font-size:14px}
.toast button{font:inherit;font-size:13px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);padding:6px 10px;cursor:pointer}
.toast button.ok{background:var(--accent);border-color:var(--accent);color:#fff}
.tl-sec{font-size:13px;color:var(--muted);margin:0 0 6px}
.tl-row{display:flex;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line);min-height:46px}
.tl-row:last-child{border-bottom:0}
.tl-h{width:46px;flex:none;font-size:13px;color:var(--muted);padding-top:6px}
.tl-b{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.tl-t{display:flex;align-items:center;gap:8px;background:var(--accent-soft);border-inline-start:4px solid var(--c);border-radius:8px;padding:6px 8px}
.tl-t.done{opacity:.55}
.tl-t.done .tx2{text-decoration:line-through}
.tl-t input{width:18px;height:18px;accent-color:var(--accent);flex:none}
.tl-t .tx2{flex:1;min-width:0;word-break:break-word}
.tl-t .tm{font-size:12px;color:var(--muted);flex:none}
.tl-add{background:none;border:0;color:var(--muted);cursor:pointer;font-size:16px;align-self:flex-start;opacity:.55;padding:0 4px}
.tl-row.now{border-inline-start:3px solid var(--accent);padding-inline-start:8px}
.tl-row.now .tl-h{color:var(--accent);font-weight:700}
.tl-un{margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.badge{font-size:11px;line-height:1.6;padding:0 8px;border-radius:99px;border:1px solid var(--c);color:var(--c);white-space:nowrap}
li{border-inline-start:4px solid var(--c,transparent);padding-inline-start:10px}
li.grp{border:0;padding:12px 0 4px;font-size:13px;font-weight:700;color:var(--muted)}
li.empty{border:0}
.tabs+.tabs{margin-top:-2px}
body{background:linear-gradient(180deg,var(--bg) 0%,var(--bg2) 100%) fixed;min-height:100vh}
h1{color:var(--accent);font-size:22px}
.card{border-radius:20px;box-shadow:0 6px 20px rgba(219,39,119,.09);border-color:var(--line)}
.bar{height:12px}
.bar i{background:linear-gradient(90deg,#f9a8d4,var(--accent))}
.add{background:linear-gradient(135deg,#f472b6,var(--accent));border-radius:12px;font-weight:700}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.nav button{border-radius:12px}
.nav button:hover,.tabs button:hover{background:var(--accent-soft)}
li.grp{color:var(--accent)}
.tl-t{border-radius:12px}
.toast{border-radius:16px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .toast button.ok{color:#2a0f1b}}
:root[data-theme="dark"] .toast button.ok{color:#2a0f1b}
.days{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px}
.chip input{display:none}
.chip span{display:inline-block;padding:6px 12px;border:1px solid var(--line);border-radius:99px;cursor:pointer;font-size:13px;color:var(--muted);user-select:none}
.chip input:checked+span{background:var(--accent-soft);color:var(--accent);border-color:var(--accent);font-weight:700}
.msg{color:var(--high);font-size:13px;grid-column:1/-1}
#views button{font-size:13px;padding:6px 2px}
</style>
</head>
<body>
<main>
  <div class="top">
    <div>
      <h1>🌸 برنامه‌ریز روزانه</h1>
      <div class="date" id="date"></div>
    </div>
    <div class="nav">
      <button id="next" title="روز بعد">›</button>
      <button id="today">امروز</button>
      <button id="prev" title="روز قبل">‹</button>
    </div>
  </div>

  <div id="toasts"></div>

  <div class="card rem">
    <span>🔔 یادآوری:</span>
    <select id="lead" aria-label="زمان یادآوری">
      <option value="60">۶۰ دقیقه قبل</option>
      <option value="30" selected>۳۰ دقیقه قبل</option>
      <option value="15">۱۵ دقیقه قبل</option>
      <option value="10">۱۰ دقیقه قبل</option>
      <option value="5">۵ دقیقه قبل</option>
    </select>
    <button id="perm" type="button">فعال‌سازی اعلان</button>
    <span class="st" id="permst"></span>
  </div>

  <div class="card" id="progcard">
    <div class="prog-row"><span id="count">۰ از ۰ انجام شد</span><span id="pct">۰٪</span></div>
    <div class="bar"><i id="fill"></i></div>
  </div>

  <div class="card" id="addcard">
    <form id="f">
      <input type="text" id="txt" placeholder="کار جدید…" required maxlength="120" autocomplete="off">
      <div class="row">
        <input type="time" id="time" aria-label="ساعت">
        <input type="time" id="end" aria-label="تا ساعت" title="تا ساعت (اختیاری)">
        <select id="pri" aria-label="اولویت">
          <option value="2">اولویت: زیاد</option>
          <option value="1" selected>اولویت: متوسط</option>
          <option value="0">اولویت: کم</option>
        </select>
      </div>
      <button class="add" type="submit">افزودن</button>
    </form>
  </div>

  <div class="tabs" id="views">
    <button data-v="list" class="on">📝 فهرست کارها</button>
    <button data-v="tl">🕒 برنامهٔ ساعتی</button>
    <button data-v="inbox">📌 بدون تایم</button>
    <button data-v="rec">🔁 ثابت‌ها</button>
  </div>

  <div class="card" id="tlcard" hidden></div>

  <div class="card" id="listcard">
    <div class="tabs" id="tabs">
      <button data-f="all" class="on">همه</button>
      <button data-f="open">باقی‌مانده</button>
      <button data-f="done">انجام‌شده</button>
    </div>
    <div class="tabs" id="sorts">
      <button data-s="time" class="on">⏱ مرتب‌سازی: ساعت</button>
      <button data-s="pri">🚩 مرتب‌سازی: اولویت</button>
    </div>
    <ul id="list"></ul>
    <div class="foot"><span></span><button id="clr">پاک کردن انجام‌شده‌ها</button></div>
  </div>

  <div class="card" id="inboxcard" hidden>
    <h2>📌 کارهای بدون تایم</h2>
    <div class="date" style="margin-bottom:10px">اولویت ۱ تا ۱۰ (۱ = مهم‌ترین). با تیک زدن، کار انجام‌شده حذف می‌شود.</div>
    <form id="inf">
      <input type="text" id="intxt" placeholder="کار جدید (بدون ساعت)…" required maxlength="120" autocomplete="off">
      <div class="row"><select id="inpri" aria-label="اولویت"></select></div>
      <button class="add" type="submit">افزودن</button>
    </form>
    <ul id="inlist" style="margin-top:10px"></ul>
  </div>

  <div class="card" id="reccard" hidden>
    <h2>🔁 برنامه‌های ثابت هفتگی</h2>
    <div class="date" style="margin-bottom:10px">یک بار بنویسید؛ در روزهای انتخاب‌شده هر هفته خودکار به برنامه اضافه می‌شود.</div>
    <form id="rf">
      <input type="text" id="rtxt" placeholder="مثلاً: باشگاه" required maxlength="80" autocomplete="off">
      <div class="row">
        <input type="time" id="rs" required aria-label="از ساعت" title="از ساعت">
        <input type="time" id="re" aria-label="تا ساعت" title="تا ساعت">
        <select id="rpri" aria-label="اولویت"><option value="2">اولویت: زیاد</option><option value="1" selected>اولویت: متوسط</option><option value="0">اولویت: کم</option></select>
      </div>
      <div class="days" id="rdays"></div>
      <div class="msg" id="rmsg"></div>
      <button class="add" type="submit">ذخیره برنامه</button>
    </form>
    <ul id="rlist" style="margin-top:10px"></ul>
  </div>

  <div class="card" id="notecard">
    <h2>یادداشت امروز</h2>
    <textarea id="note" placeholder="هر چیزی که می‌خواهید یادتان بماند…"></textarea>
  </div>
</main>

<script>
(function(){
  var fa = new Intl.NumberFormat('fa-IR');
  var dateFmt = new Intl.DateTimeFormat('fa-IR-u-ca-persian',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
  var cur = new Date(); cur.setHours(12,0,0,0);
  var filter = 'all';
  var mem = {};
  var colors = ['var(--low)','var(--mid)','var(--high)'];
  var pNames = [{name:'کم',icon:'🔵',rank:'۳'},{name:'متوسط',icon:'🟠',rank:'۲'},{name:'زیاد',icon:'🔴',rank:'۱'}];
  function badge(p){
    var b=document.createElement('span'); b.className='badge';
    b.style.setProperty('--c',colors[p]);
    b.textContent=pNames[p].icon+' '+pNames[p].rank+' · '+pNames[p].name;
    return b;
  }

  function key(d){var m=d.getMonth()+1,x=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(x<10?'0':'')+x}
  function load(){
    var k='planner:'+key(cur);
    var o=null;
    try{var r=localStorage.getItem(k); if(r) o=JSON.parse(r)}catch(e){}
    if(!o) o=mem[k]||{tasks:[],note:''};
    if(materialize(o,cur)){
      mem[k]=o;
      try{localStorage.setItem(k,JSON.stringify(o))}catch(e){}
    }
    return o;
  }
  function save(d){
    var k='planner:'+key(cur); mem[k]=d;
    try{localStorage.setItem(k,JSON.stringify(d))}catch(e){}
  }
  var data = load();

  var $=function(i){return document.getElementById(i)};

  function render(){
    $('date').textContent = dateFmt.format(cur);
    var t = data.tasks.slice().sort(function(a,b){
      if(a.done!==b.done) return a.done?1:-1;
      if(sortMode==='pri' && a.pri!==b.pri) return b.pri-a.pri;
      if((a.time||'99')!==(b.time||'99')) return (a.time||'99')<(b.time||'99')?-1:1;
      return b.pri-a.pri;
    });
    var done = t.filter(function(x){return x.done}).length;
    var p = t.length ? Math.round(done/t.length*100) : 0;
    $('count').textContent = fa.format(done)+' از '+fa.format(t.length)+' انجام شد';
    $('pct').textContent = fa.format(p)+'٪';
    $('fill').style.width = p+'%';
    var shown = t.filter(function(x){return filter==='all'||(filter==='done'?x.done:!x.done)});
    var ul = $('list'); ul.innerHTML='';
    if(!shown.length){
      var e=document.createElement('li'); e.className='empty'; e.style.justifyContent='center';
      e.textContent = t.length ? 'موردی در این بخش نیست' : 'هنوز کاری ثبت نکرده‌اید';
      ul.appendChild(e);
    }
    var lastG=null;
    shown.forEach(function(x){
      if(sortMode==='pri'){
        var g=x.done?'d':x.pri;
        if(g!==lastG){
          lastG=g;
          var gh=document.createElement('li'); gh.className='grp';
          gh.textContent = g==='d' ? '✅ انجام‌شده' : pNames[g].icon+' اولویت '+pNames[g].rank+' ('+pNames[g].name+')';
          ul.appendChild(gh);
        }
      }
      var li=document.createElement('li'); if(x.done) li.className='done';
      li.style.setProperty('--c',colors[x.pri]);
      var cb=document.createElement('input'); cb.type='checkbox'; cb.checked=x.done;
      cb.onchange=function(){x.done=cb.checked; save(data); render()};
      var box=document.createElement('div'); box.className='t';
      var tt=document.createElement('div'); tt.textContent=x.text;
      var m=document.createElement('div'); m.className='meta';
      var dot=document.createElement('span'); dot.className='dot'; dot.style.background=colors[x.pri];
      m.appendChild(badge(x.pri));
      if(x.time){var s=document.createElement('span'); s.textContent=x.time.replace(/\d/g,function(d){return '۰۱۲۳۴۵۶۷۸۹'[d]}); m.appendChild(s)}
      if(x.end){var e2=document.createElement('span'); e2.textContent='تا '+pd(x.end); m.appendChild(e2)}
      if(x.rid){var e3=document.createElement('span'); e3.textContent='🔁'; e3.title='برنامه ثابت'; m.appendChild(e3)}
      box.appendChild(tt); box.appendChild(m);
      var del=document.createElement('button'); del.className='del'; del.textContent='×'; del.title='حذف';
      del.onclick=function(){if(x.rid){data.skip=data.skip||[]; data.skip.push(x.rid)} data.tasks=data.tasks.filter(function(y){return y!==x}); save(data); render()};
      li.appendChild(cb); li.appendChild(box); li.appendChild(del);
      ul.appendChild(li);
    });
    $('note').value = data.note||'';
    renderTL();
  }

  function pd(s){return String(s).replace(/\d/g,function(d){return '۰۱۲۳۴۵۶۷۸۹'[d]})}
  var view='list'; var sortMode='time';
  $('sorts').onclick=function(e){
    var b=e.target.closest('button'); if(!b) return;
    sortMode=b.dataset.s;
    Array.prototype.forEach.call($('sorts').children,function(c){c.classList.toggle('on',c===b)});
    render();
  };
  $('views').onclick=function(e){
    var b=e.target.closest('button'); if(!b) return;
    view=b.dataset.v;
    Array.prototype.forEach.call($('views').children,function(c){c.classList.toggle('on',c===b)});
    var map={list:'listcard',tl:'tlcard',inbox:'inboxcard',rec:'reccard'};
    Object.keys(map).forEach(function(k){$(map[k]).hidden = k!==view});
    var dayOnly = view==='list'||view==='tl';
    ['addcard','progcard','notecard'].forEach(function(i){$(i).hidden=!dayOnly});
    renderTL();
    if(view==='tl'){var n=document.querySelector('.tl-row.now'); if(n&&n.scrollIntoView) n.scrollIntoView({block:'center'})}
  };

  function tlItem(t){
    var d=document.createElement('div'); d.className='tl-t'+(t.done?' done':'');
    d.style.setProperty('--c',colors[t.pri]);
    var cb=document.createElement('input'); cb.type='checkbox'; cb.checked=t.done;
    cb.onchange=function(){t.done=cb.checked; save(data); render()};
    var tx=document.createElement('span'); tx.className='tx2'; tx.textContent=t.text;
    d.appendChild(cb); d.appendChild(tx); d.appendChild(badge(t.pri));
    if(t.time){var tm=document.createElement('span'); tm.className='tm'; tm.textContent=pd(t.time)+(t.end?'–'+pd(t.end):'')+(t.rid?' 🔁':''); d.appendChild(tm)}
    var del=document.createElement('button'); del.className='del'; del.textContent='×'; del.title='حذف';
    del.onclick=function(){if(t.rid){data.skip=data.skip||[]; data.skip.push(t.rid)} data.tasks=data.tasks.filter(function(y){return y!==t}); save(data); render()};
    d.appendChild(del);
    return d;
  }

  function renderTL(){
    var box=$('tlcard'); if(box.hidden) return;
    box.innerHTML='';
    var timed=data.tasks.filter(function(t){return t.time});
    var untimed=data.tasks.filter(function(t){return !t.time});
    if(!data.tasks.length){
      var e=document.createElement('div'); e.className='empty';
      e.textContent='برای این روز هنوز کاری ثبت نشده. از فرم بالا کار با ساعت اضافه کنید.';
      box.appendChild(e);
    }
    if(untimed.length){
      var un=document.createElement('div'); un.className='tl-un';
      var h=document.createElement('div'); h.className='tl-sec'; h.textContent='بدون ساعت مشخص';
      un.appendChild(h);
      var wrap=document.createElement('div'); wrap.style.cssText='display:flex;flex-direction:column;gap:6px';
      untimed.forEach(function(t){wrap.appendChild(tlItem(t))});
      un.appendChild(wrap); box.appendChild(un);
    }
    var hrs=timed.map(function(t){return +t.time.split(':')[0]});
    var from=Math.min.apply(null,hrs.concat([6])), to=Math.max.apply(null,hrs.concat([22]));
    var isToday = key(cur)===key(new Date()), nowH=new Date().getHours();
    for(var h2=from; h2<=to; h2++){
      var row=document.createElement('div'); row.className='tl-row'+(isToday&&h2===nowH?' now':'');
      var lab=document.createElement('div'); lab.className='tl-h'; lab.textContent=pd((h2<10?'0':'')+h2+':00');
      var body=document.createElement('div'); body.className='tl-b';
      timed.filter(function(t){return +t.time.split(':')[0]===h2})
        .sort(function(a,b){return a.time<b.time?-1:a.time>b.time?1:0})
        .forEach(function(t){body.appendChild(tlItem(t))});
      var add=document.createElement('button'); add.className='tl-add'; add.type='button'; add.textContent='＋'; add.title='افزودن کار در این ساعت';
      (function(hh){add.onclick=function(){
        $('time').value=(hh<10?'0':'')+hh+':00';
        window.scrollTo({top:0,behavior:'smooth'}); $('txt').focus();
      }})(h2);
      body.appendChild(add);
      row.appendChild(lab); row.appendChild(body); box.appendChild(row);
    }
  }

  $('f').onsubmit=function(e){
    e.preventDefault();
    var v=$('txt').value.trim(); if(!v) return;
    data.tasks.push({text:v,time:$('time').value,end:$('end').value,pri:+$('pri').value,done:false});
    save(data); $('txt').value=''; $('time').value=''; $('end').value=''; render();
  };
  $('note').oninput=function(){data.note=$('note').value; save(data)};
  $('clr').onclick=function(){
    data.skip=data.skip||[];
    data.tasks.forEach(function(x){if(x.done&&x.rid) data.skip.push(x.rid)});
    data.tasks=data.tasks.filter(function(x){return !x.done}); save(data); render()
  };
  $('tabs').onclick=function(e){
    var b=e.target.closest('button'); if(!b) return;
    filter=b.dataset.f;
    Array.prototype.forEach.call($('tabs').children,function(c){c.classList.toggle('on',c===b)});
    render();
  };
  function go(n){cur.setDate(cur.getDate()+n); data=load(); render()}
  $('prev').onclick=function(){go(-1)};
  $('next').onclick=function(){go(1)};
  $('today').onclick=function(){cur=new Date(); cur.setHours(12,0,0,0); data=load(); render()};
  /* ---------- یادآوری ---------- */
  /* ---------- بدون تایم و برنامه‌های ثابت ---------- */
  var DAYS=[{n:'شنبه',v:6},{n:'یکشنبه',v:0},{n:'دوشنبه',v:1},{n:'سه‌شنبه',v:2},{n:'چهارشنبه',v:3},{n:'پنجشنبه',v:4},{n:'جمعه',v:5}];

  function inboxLoad(){
    try{var r=localStorage.getItem('planner:inbox'); if(r) return JSON.parse(r)}catch(e){}
    return mem['planner:inbox']||[];
  }
  function inboxSave(a){
    mem['planner:inbox']=a;
    try{localStorage.setItem('planner:inbox',JSON.stringify(a))}catch(e){}
  }
  function rulesLoad(){
    try{var r=localStorage.getItem('planner:rules'); if(r) return JSON.parse(r)}catch(e){}
    return mem['planner:rules']||[];
  }
  function rulesSave(a){
    mem['planner:rules']=a;
    try{localStorage.setItem('planner:rules',JSON.stringify(a))}catch(e){}
  }

  function materialize(obj,d){
    var wd=d.getDay(), dk=key(d), rules=rulesLoad(), ids={}, changed=false;
    obj.skip=obj.skip||[];
    rules.forEach(function(r){ids[r.id]=1});
    var n0=obj.tasks.length;
    obj.tasks=obj.tasks.filter(function(t){return !t.rid || ids[t.rid] || t.done});
    if(obj.tasks.length!==n0) changed=true;
    rules.forEach(function(r){
      if(r.days.indexOf(wd)<0) return;
      if(r.from && dk<r.from) return;
      if(obj.skip.indexOf(r.id)>=0) return;
      if(obj.tasks.some(function(t){return t.rid===r.id})) return;
      obj.tasks.push({text:r.text,time:r.start,end:r.end||'',pri:r.pri,done:false,rid:r.id});
      changed=true;
    });
    return changed;
  }

  /* بدون تایم */
  (function(){
    var s=$('inpri');
    for(var i=1;i<=10;i++){
      var o=document.createElement('option'); o.value=String(i);
      o.textContent='اولویت '+pd(i)+(i===1?' (مهم‌ترین)':i===10?' (کم‌اهمیت‌ترین)':'');
      if(i===5) o.selected=true;
      s.appendChild(o);
    }
  })();
  function renderInbox(){
    var ul=$('inlist'); ul.innerHTML='';
    var a=inboxLoad().slice().sort(function(x,y){return (x.pri-y.pri)||(x.id-y.id)});
    if(!a.length){
      var e=document.createElement('li'); e.className='empty'; e.style.justifyContent='center';
      e.textContent='کار بدون تایمی ندارید 🎉'; ul.appendChild(e);
    }
    a.forEach(function(x){
      var c = x.pri<=3?'var(--high)':x.pri<=6?'var(--mid)':'var(--low)';
      var li=document.createElement('li'); li.style.setProperty('--c',c);
      var cb=document.createElement('input'); cb.type='checkbox';
      cb.onchange=function(){
        if(!cb.checked) return;
        li.classList.add('done');
        setTimeout(function(){inboxSave(inboxLoad().filter(function(y){return y.id!==x.id})); renderInbox()},500);
      };
      var t=document.createElement('div'); t.className='t'; t.textContent=x.text;
      var b=document.createElement('span'); b.className='badge'; b.style.setProperty('--c',c);
      b.textContent='اولویت '+pd(x.pri);
      var del=document.createElement('button'); del.className='del'; del.textContent='×'; del.title='حذف';
      del.onclick=function(){inboxSave(inboxLoad().filter(function(y){return y.id!==x.id})); renderInbox()};
      li.appendChild(cb); li.appendChild(t); li.appendChild(b); li.appendChild(del);
      ul.appendChild(li);
    });
  }
  $('inf').onsubmit=function(e){
    e.preventDefault();
    var v=$('intxt').value.trim(); if(!v) return;
    var a=inboxLoad(); a.push({id:Date.now(),text:v,pri:+$('inpri').value});
    inboxSave(a); $('intxt').value=''; renderInbox();
  };

  /* برنامه‌های ثابت */
  DAYS.forEach(function(d){
    var l=document.createElement('label'); l.className='chip';
    var i=document.createElement('input'); i.type='checkbox'; i.value=String(d.v);
    var s=document.createElement('span'); s.textContent=d.n;
    l.appendChild(i); l.appendChild(s); $('rdays').appendChild(l);
  });
  function renderRec(){
    var ul=$('rlist'); ul.innerHTML='';
    var rs=rulesLoad();
    if(!rs.length){
      var e=document.createElement('li'); e.className='empty'; e.style.justifyContent='center';
      e.textContent='هنوز برنامهٔ ثابتی ثبت نکرده‌اید'; ul.appendChild(e);
    }
    rs.forEach(function(r){
      var li=document.createElement('li'); li.style.setProperty('--c',colors[r.pri]);
      var box=document.createElement('div'); box.className='t';
      var tt=document.createElement('div'); tt.textContent=r.text;
      var m=document.createElement('div'); m.className='meta';
      var names=DAYS.filter(function(d){return r.days.indexOf(d.v)>=0}).map(function(d){return d.n}).join('، ');
      var info=document.createElement('span');
      info.textContent=pd(r.start)+(r.end?' تا '+pd(r.end):'')+' · '+names;
      m.appendChild(badge(r.pri)); m.appendChild(info);
      box.appendChild(tt); box.appendChild(m);
      var del=document.createElement('button'); del.className='del'; del.textContent='×'; del.title='حذف برنامه';
      del.onclick=function(){
        rulesSave(rulesLoad().filter(function(y){return y.id!==r.id}));
        if(materialize(data,cur)) save(data);
        render(); renderRec();
      };
      li.appendChild(box); li.appendChild(del); ul.appendChild(li);
    });
  }
  $('rf').onsubmit=function(e){
    e.preventDefault();
    var v=$('rtxt').value.trim(); if(!v) return;
    var days=[];
    Array.prototype.forEach.call($('rdays').querySelectorAll('input'),function(i){if(i.checked) days.push(+i.value)});
    if(!days.length){$('rmsg').textContent='حداقل یک روز هفته را انتخاب کنید.'; return}
    $('rmsg').textContent='';
    var a=rulesLoad();
    a.push({id:'r'+Date.now(),text:v,start:$('rs').value,end:$('re').value,pri:+$('rpri').value,days:days,from:key(new Date())});
    rulesSave(a);
    $('rtxt').value=''; $('rs').value=''; $('re').value='';
    Array.prototype.forEach.call($('rdays').querySelectorAll('input'),function(i){i.checked=false});
    if(materialize(data,cur)) save(data);
    render(); renderRec();
  };
  renderInbox(); renderRec();

  var lead = 30;
  try{var lv=localStorage.getItem('planner:lead'); if(lv) lead=+lv}catch(e){}
  $('lead').value = String(lead);
  $('lead').onchange=function(){lead=+$('lead').value; try{localStorage.setItem('planner:lead',String(lead))}catch(e){} check()};

  function permText(){
    var s=$('permst');
    if(typeof Notification==='undefined'){s.textContent='این مرورگر اعلان سیستمی ندارد؛ یادآور داخل صفحه نمایش داده می‌شود.';return}
    if(Notification.permission==='granted') s.textContent='اعلان سیستمی فعال است (تا وقتی این صفحه باز باشد).';
    else if(Notification.permission==='denied') s.textContent='اعلان در مرورگر مسدود شده؛ از تنظیمات سایت آن را مجاز کنید. فعلاً یادآور داخل صفحه نمایش داده می‌شود.';
    else s.textContent='برای اعلان سیستمی، دکمه را بزنید و اجازه بدهید.';
  }
  $('perm').onclick=function(){
    try{
      if(typeof Notification==='undefined'){permText();return}
      var r=Notification.requestPermission(function(){permText()});
      if(r&&r.then) r.then(permText);
    }catch(e){permText()}
  };
  permText();

  function beep(){
    try{
      var C=window.AudioContext||window.webkitAudioContext; var a=new C();
      var o=a.createOscillator(), g=a.createGain();
      o.connect(g); g.connect(a.destination); o.frequency.value=880; g.gain.value=0.08;
      o.start(); setTimeout(function(){o.stop(); a.close()},350);
    }catch(e){}
  }

  function dayData(d){
    if(key(d)===key(cur)) return data;
    try{var r=localStorage.getItem('planner:'+key(d)); if(r) return JSON.parse(r)}catch(e){}
    return mem['planner:'+key(d)]||null;
  }
  function saveDay(d,obj){
    if(key(d)===key(cur)){save(obj);return}
    mem['planner:'+key(d)]=obj;
    try{localStorage.setItem('planner:'+key(d),JSON.stringify(obj))}catch(e){}
  }

  function toast(task,title,body,dayObj,dayDate){
    var box=document.createElement('div'); box.className='toast';
    var tx=document.createElement('div'); tx.className='tx';
    var b=document.createElement('b'); b.textContent=title;
    var p=document.createElement('span'); p.textContent=body;
    tx.appendChild(b); tx.appendChild(p);
    var ok=document.createElement('button'); ok.className='ok'; ok.textContent='انجام شد ✓';
    ok.onclick=function(){task.done=true; saveDay(dayDate,dayObj); box.remove(); render()};
    var x=document.createElement('button'); x.textContent='باشه';
    x.onclick=function(){box.remove()};
    box.appendChild(tx); box.appendChild(ok); box.appendChild(x);
    $('toasts').appendChild(box);
    beep();
    try{
      if(typeof Notification!=='undefined' && Notification.permission==='granted'){
        new Notification(title,{body:body});
      }
    }catch(e){}
  }

  function check(){
    var now=new Date(), d=new Date(now.getFullYear(),now.getMonth(),now.getDate(),12,0,0,0);
    var obj=dayData(d)||{tasks:[],note:''};
    var changed=materialize(obj,d);
    obj.tasks.forEach(function(t){
      if(t.done||!t.time) return;
      var hm=t.time.split(':');
      var due=new Date(now.getFullYear(),now.getMonth(),now.getDate(),+hm[0],+hm[1],0,0);
      var mins=Math.round((due-now)/60000);
      if(mins<=0 && mins>-120 && !t.nDue){
        t.nDue=true; t.nLead=true; changed=true;
        toast(t,'⏰ الان وقتشه!',t.text,obj,d);
      } else if(mins>0 && mins<=lead && !t.nLead){
        t.nLead=true; changed=true;
        toast(t,'🔔 '+fa.format(mins)+' دقیقه دیگر وقت داری',t.text,obj,d);
      }
    });
    if(changed){save2(obj,d); render()}
  }
  function save2(obj,d){saveDay(d,obj)}
  setInterval(check,15000);
  document.addEventListener('visibilitychange',function(){if(!document.hidden) check()});
  check();

  render();
})();
</script>
</body>
</html>
